<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solutions & Notes Admin</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4ece4;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .dashboard-box {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            border-top: 5px solid #4a7c59;
        }
        h2 {
            color: #1a2b2b;
            margin-top: 0;
            text-align: center;
        }
        .success {
            background-color: #e1f5fe;
            color: #0288d1;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 0.9em;
        }
        label {
            font-weight: 600;
            font-size: 0.9em;
            color: #1a2b2b;
        }
        select, input[type="file"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            background-color: #faf8f5;
            box-sizing: border-box;
        }
        button {
            background-color: #4a7c59;
            color: white;
            border: none;
            padding: 10px 15px;
            width: 100%;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
        }
        button:hover {
            background-color: #3b6347;
        }
        .links {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 0.85em;
        }
        .links a {
            color: #4a7c59;
            text-decoration: none;
        }
        .links a.logout {
            color: #e84118;
        }
    </style>
</head>
<body>
    <div class="dashboard-box">
        <h2>Solutions & Notes Admin</h2>
        
        {% if success %}
            <div class="success">{{ success }}</div>
        {% endif %}

        <form method="POST" enctype="multipart/form-data">
            <label for="subject">Subject Chuniye:</label>
            <select name="subject" required>
                <option value="" disabled selected>-- Select Subject --</option>
                {% for code, name in subjects.items() %}
                    <option value="{{ code }}">{{ name }}</option>
                {% endfor %}
            </select>

            <label for="pdf_file">Solution/Notes PDF File select karein:</label>
            <input type="file" name="pdf_file" accept=".pdf" required>
            
            <button type="submit">Upload Solution PDF</button>
        </form>

        <div class="links">
            <a href="/solutions" target="_blank">View Public Solutions</a>
            <a href="/logout" class="logout">Logout</a>
        </div>
    </div>
</body>
</html>
