<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Admin Dashboard</h1>
        <div>
            <a href="/" class="btn">Home</a>
            <a href="/logout" class="btn" style="background-color: #d9534f;">Logout</a>
        </div>
        
        {% if message %}
            <p style="color: green; margin-top: 15px; font-weight: bold;">{{ message }}</p>
        {% endif %}

        <form method="POST" enctype="multipart/form-data" style="margin-top: 20px;">
            <h3>Upload Subject-Wise Solution PDF</h3>
            
            <label for="subject" style="font-weight: bold;">Select Subject:</label><br>
            <select name="subject" required style="padding: 10px; margin: 10px 0 15px 0; width: 100%; box-sizing: border-box; border-radius: 5px; border: 1px solid #ccc;">
                <option value="" disabled selected>-- Choose BCA Subject --</option>
                {% for key, name in subjects.items() %}
                    <option value="{{ key }}">{{ name }}</option>
                {% endfor %}
            </select>
            <br>
            
            <label for="file" style="font-weight: bold;">Upload PDF File:</label><br>
            <input type="file" name="file" accept=".pdf" required style="margin: 10px 0 15px 0;">
            <br>
            
            <button type="submit" class="btn">Upload Solution</button>
        </form>
    </div>
</body>
</html>
